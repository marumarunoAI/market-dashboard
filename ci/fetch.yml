name: fetch data
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours (UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
